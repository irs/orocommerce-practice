services:
    training.importexport.data_converter.user_naming_type:
        parent: oro_importexport.data_converter.configurable
    
    training.importexport.strategy.user_naming_type.add_or_replace:
        parent: oro_importexport.strategy.configurable_add_or_replace
    
    training.importexport.processor.export.user_naming_type:
        parent: oro_importexport.processor.export_abstract
        calls:
            - [setDataConverter, ['@training.importexport.data_converter.user_naming_type']]
        tags:
            - name: oro_importexport.processor
              type: export
              entity: Training\Bundle\UserNamingBundle\Entity\UserNamingType
              alias: user_naming_type
    
    training.importexport.processor.import.user_naming_type:
        parent: oro_importexport.processor.import_abstract
        calls:
            - [setDataConverter, ['@training.importexport.data_converter.user_naming_type']]
            - [setStrategy, ['@training.importexport.strategy.user_naming_type.add_or_replace']]
        tags:
            - name: oro_importexport.processor
              type: import
              entity: Training\Bundle\UserNamingBundle\Entity\UserNamingType
              alias: user_naming_type
            - name: oro_importexport.processor
              type: import_validation
              entity: Training\Bundle\UserNamingBundle\Entity\UserNamingType
              alias: user_naming_type

    training.importexport.configuration_provider.user_naming_type:
        class: Training\Bundle\ImportExportBundle\Configuration\UserNamingTypeConfigProvider
        tags:
            - { name: oro_importexport.configuration, alias: user_naming_type }

    training.importexport.template_fixture.user_naming_type:
        class: Training\Bundle\ImportExportBundle\TemplateFixture\UserNamingTypeFixture
        public: false
        tags:
            - { name: oro_importexport.template_fixture }

    training.importexport.fixtures.data_converter:
        class: Oro\Bundle\ImportExportBundle\Converter\ConfigurableTableDataConverter
        parent: oro_importexport.data_converter.template_fixture.configurable
        public: false

    training.importexport.processor.export_template.user_naming_type:
        parent: oro_importexport.processor.export_abstract
        public: false
        calls:
            - [setDataConverter, ['@training.importexport.fixtures.data_converter']]
        tags:
            - name: oro_importexport.processor
              type: export_template
              entity: Training\Bundle\UserNamingBundle\Entity\UserNamingType
              alias: user_naming_type